image:
  registry: "domain.local"
  name: "volcanosh/deviceplugin-mock"
  tag: ""
  pullPolicy: IfNotPresent

controller:
  resources:
    requests:
      cpu: "0.2"
      memory: 200Mi
    limits:
      cpu: "0.2"
      memory: 200Mi

daemon:
